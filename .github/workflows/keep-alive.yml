name: 🟢 Supabase Keep-Alive Ping

# Executa a cada 5 dias às 03:00 UTC (evita a pausa automática do plano Free do Supabase após 7 dias de inatividade)
on:
  schedule:
    - cron: '0 3 */5 * *'

  # Permite disparar manualmente a qualquer momento via GitHub Actions UI
  workflow_dispatch:

jobs:
  keep-alive:
    name: Insert Random Data Ping
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 🎲 Inserir dado aleatório e seguro no Supabase
        run: |
          RANDOM_HASH=$(openssl rand -hex 16)
          echo "Disparando ping seguro com hash: $RANDOM_HASH"

          curl --silent --show-error --fail \
            --max-time 15 \
            --request POST \
            "$SUPABASE_URL/rest/v1/keep_alive_log" \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
            --header "Content-Type: application/json" \
            --header "Prefer: return=minimal" \
            --data "{\"random_hash\": \"$RANDOM_HASH\", \"source\": \"github-actions-cron\"}"

          echo "✅ Ping registrado no Supabase em $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
